{%- assign t = site.data.ui-text[site.active_lang] -%}
<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__brand">
      <img class="site-footer__logo logo-outline" src="{{ site.logo }}" alt="" width="28" height="40">
      <span>&copy; {{ site.time | date: "%Y" }} {{ t.title }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a></span>
    </div>
    <nav aria-label="{{ t.footer_nav_label }}">
      <ul>
        {%- for link in site.footer.links %}
        <li><a href="{{ link.url }}" rel="noopener">{{ link.label }}</a></li>
        {%- endfor %}
        <li><a href="/feed.xml">{{ t.feed_label }}</a></li>
      </ul>
    </nav>
  </div>
</footer>
