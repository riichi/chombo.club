{%- set title_words = t.title | split(pat=" ") -%}
<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="masthead__brand" href="{{ lang_prefix }}/">
      <img class="masthead__logo logo-outline"
           src="{{ config.extra.logo }}"
           alt=""
           width="42"
           height="60">
      <span class="masthead__title">{{ title_words | first }}
        <br>
      {{ title_words[1:] | join(sep=" ") }}</span>
    </a>
    <nav class="masthead__nav" aria-label="{{ t.nav_label }}">
      <ul class="nav-list">
        {{ <nav_items nav={nav} current_path={current_path} post_category_url={post_category_url} prefix={lang_prefix} separator={true} /> }}
      </ul>
    </nav>
    <div class="masthead__tools">
      <button class="icon-btn"
              type="button"
              data-search-open
              aria-label="{{ t.search_label }}"
              aria-haspopup="dialog">
        <svg class="icon" aria-hidden="true">
          <use href="#i-search" />
        </svg>
      </button>
      {{ <theme_toggle t={t} class="icon-btn masthead__desktop" /> }}
      {% include "partials/lang_link.html" %}
      <details class="masthead__menu">
        <summary class="icon-btn" aria-label="{{ t.menu_label }}">
          <svg class="icon icon-open" aria-hidden="true">
            <use href="#i-menu" />
          </svg>
          <svg class="icon icon-close" aria-hidden="true">
            <use href="#i-close" />
          </svg>
        </summary>
        <div class="menu-panel">
          <nav class="wrap" aria-label="{{ t.nav_label }}">
            <ul class="menu-list">
              {{ <nav_items nav={nav} current_path={current_path} post_category_url={post_category_url} prefix={lang_prefix} /> }}
              <li class="menu-sep" aria-hidden="true"></li>
              <li>{{ <theme_toggle t={t} text={true} /> }}</li>
            </ul>
          </nav>
        </div>
      </details>
    </div>
  </div>
</header>
