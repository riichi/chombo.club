base_url = "https://chombo.club"
title = "Krakowski Klub Chombo"
description = "Stowarzyszenie skupione na grze i promocji japońskiego (riichi) mahjonga."
default_language = "pl"
compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["feed.xml"]
feed_limit = 10
taxonomies = [{ name = "categories", render = true }]

[markdown]
smart_punctuation = true
external_links_external = false

[languages.en]
description = "We are a group of players located in Kraków focused on playing and promoting Japanese (Rīchi) Mahjong."
generate_feeds = true
feed_filenames = ["feed.xml", "404.html"]  # 404: Zola renders it for the default language only
title = "Kraków Chombo Club"
taxonomies = [{ name = "categories", render = true }]

