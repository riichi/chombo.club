# Pinned site tools: `mise install` sets up the exact versions CI uses.
# Developer tasks live in the justfile (`just --list`).
[tools]
zola = "0.23.6"
# Not in the mise registry; the extended build adds Chinese/Japanese word segmentation.
"github:Pagefind/pagefind" = { version = "1.3.0", matching = "pagefind_extended", rename_exe = "pagefind" }
